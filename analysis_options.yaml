include:
  - package:flutter_lints/flutter.yaml
  - package:kaisel_lint/recommended.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# analysis_options.yaml
plugins:
  kaisel_lint:
    version: ^0.5.0
    diagnostics:
      require_route_props: true
      avoid_modal_route_on_main_stack: true
      prefer_const_route_constructors: true # opt-in
